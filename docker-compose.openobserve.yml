# OpenObserve 集成配置
# 注意：由于 OrbStack 拦截 5080-6100 端口，需要使用 host 网络模式或更高端口
# 备用方案：使用现有 Elasticsearch 作为日志存储底座

networks:
  log-platform:
    driver: bridge

services:
  # OpenObserve 日志平台（需要使用 host 网络）
  openobserve:
    image: openobserve/openobserve:latest
    container_name: openobserve
    network_mode: host
    environment:
      - ZO_ROOT_USER_EMAIL=admin@usop.local
      - ZO_ROOT_USER_PASSWORD=Admin123!
      - ZO_DATA_DIR=/data
      - ZO_HTTP_PORT=19080
      - ZO_GRPC_PORT=19081
    volumes:
      - ./data/openobserve:/data
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 使用 Elasticsearch 作为备用日志存储
  usop:
    environment:
      # 日志存储底座配置
      - LOG_STORAGE_BACKEND=elasticsearch  # elasticsearch | openobserve
      - ES_HOSTS=http://elasticsearch:9200
      - OPENOBSERVE_URL=http://localhost:19080
      - OPENOBSERVE_USER=admin@usop.local
      - OPENOBSERVE_PASSWORD=Admin123!
      - OPENOBSERVE_ORG=default
