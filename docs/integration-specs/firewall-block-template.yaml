swagger: "2.0"
info:
  title: 防火墙IP封堵(模板)
  version: "1.0"
  description: 通用防火墙封堵集成模板。导入后请在「集成应用」卡片的「凭证」里把服务地址改成你防火墙的真实 base_url，并按厂商要求调整 /block 路径与字段名；认证选 apiKey / bearer / basic。剧本里用「HTTP 请求」节点绑定此 App 的 blockIp 动作即可。
host: fw.example.com
schemes:
  - https
basePath: /api/v1
securityDefinitions:
  apiKey:
    type: apiKey
    in: header
    name: Authorization
paths:
  /block:
    post:
      operationId: blockIp
      summary: 封堵 IP
      parameters:
        - name: ip
          in: query
          required: true
          type: string
          description: 待封堵的 IPv4
        - name: reason
          in: query
          required: false
          type: string
        - name: duration
          in: query
          required: false
          type: string
          description: 封堵时长，如 24h
  /unblock:
    post:
      operationId: unblockIp
      summary: 解封 IP
      parameters:
        - name: ip
          in: query
          required: true
          type: string
