swagger: "2.0"
info:
  title: 微步在线威胁情报
  version: "3"
  description: 微步在线 X 情报中心云 API（IP/域名/URL 威胁情报查询）。官方文档 https://x.threatbook.cn/apiDocs
  x-categories:
    - 威胁情报
host: api.threatbook.cn
schemes:
  - https
basePath: /v3
securityDefinitions:
  apiKey:
    type: apiKey
    in: query
    name: apikey
paths:
  /ip/query:
    get:
      operationId: ipQuery
      summary: IP 威胁情报查询
      description: 查询 IPv4/IPv6 的地理位置、ASN、威胁类型、攻击团伙标签等
      parameters:
        - name: resource
          in: query
          required: true
          type: string
          description: 待查询的 IPv4 或 IPv6 地址
        - name: lang
          in: query
          required: false
          type: string
          description: 返回语言，zh 或 en
  /domain/query:
    get:
      operationId: domainQuery
      summary: 域名威胁情报查询
      description: 查询域名的解析 IP、Whois、威胁判定、相关样本等
      parameters:
        - name: resource
          in: query
          required: true
          type: string
          description: 待查询域名
        - name: lang
          in: query
          required: false
          type: string
          description: 返回语言，zh 或 en
  /url/scan:
    get:
      operationId: urlScan
      summary: URL 威胁检测（提交扫描）
      description: 提交 URL 进行多引擎扫描与黑名单检测
      parameters:
        - name: url
          in: query
          required: true
          type: string
          description: 待检测的 URL
  /ip/context:
    get:
      operationId: ipContext
      summary: IP 上下文（高级查询，可选）
      description: 部分账号可用的高级 IP 上下文接口占位（如需请按官方文档补充 path）
      parameters:
        - name: resource
          in: query
          required: true
          type: string
          description: 待查询的 IP 地址
