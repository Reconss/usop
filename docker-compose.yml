services:
  # ==================== 数据库 ====================
  timescale:
    image: timescale/timescaledb:latest-pg16
    container_name: timescale
    environment:
      POSTGRES_PASSWORD: timescale_pass
      POSTGRES_USER: postgres
      POSTGRES_DB: timescale
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./postgres/init.d:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - log-platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Kafka 相关 ====================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - log-platform
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_BATCH_SIZE_BYTES: 524288
      KAFKA_LINGER_MS: 10
      KAFKA_COMPRESSION_TYPE: lz4
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - log-platform
    healthcheck:
      test: ["CMD", "kafka-broker-id", "--verify", "--zookeeper", "zookeeper:2181"]
      interval: 30s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - log-platform

  # ==================== Flink 相关 ====================
  jobmanager:
    image: flink:1.18.1-scala_2.12-java11
    container_name: flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        state.backend: rocksdb
        state.checkpoints.dir: file:///checkpoints
        state.savepoints.dir: file:///savepoints
        parallelism.default: 2
        taskmanager.numberOfTaskSlots: 4
        kafka.bootstrap.servers: kafka:29092
        state.backend.rocksdb.checkpoint.transfer.thread.num: 4
        state.backend.rocksdb.writebuffer.size: 128mb
        state.backend.rocksdb.compaction.level.max-size-level-base: 320mb
    volumes:
      - flink_checkpoints:/checkpoints
      - flink_savepoints:/savepoints
      - ./flink-jobs:/opt/flink/jobs
    networks:
      - log-platform
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5

  taskmanager:
    image: flink:1.18.1-scala_2.12-java11
    container_name: flink-taskmanager
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        state.backend: rocksdb
        state.checkpoints.dir: file:///checkpoints
        parallelism.default: 2
        taskmanager.numberOfTaskSlots: 4
        kafka.bootstrap.servers: kafka:29092
        state.backend.rocksdb.checkpoint.transfer.thread.num: 4
        state.backend.rocksdb.writebuffer.size: 128mb
    volumes:
      - flink_checkpoints:/checkpoints
      - flink_savepoints:/savepoints
      - ./flink-jobs:/opt/flink/jobs
    networks:
      - log-platform
    deploy:
      replicas: 2

  # ==================== 缓存服务 ====================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - log-platform
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  log-platform:
    driver: bridge

volumes:
  timescale_data:
  zookeeper_data:
  kafka_data:
  flink_checkpoints:
  flink_savepoints:
  redis_data:
