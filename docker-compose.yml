services:
  # ==================== 核心服务（默认启动）====================
  timescale:
    image: timescale/timescaledb:latest-pg16
    container_name: timescale
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./postgres/init.d:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - log-platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - log-platform
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Kafka（KRaft 模式，无需 Zookeeper）====================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: TUMghNssTfuY70MTwaCWkQ
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_BATCH_SIZE_BYTES: 524288
      KAFKA_LINGER_MS: 10
      KAFKA_COMPRESSION_TYPE: lz4
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - log-platform
    healthcheck:
      test: ["CMD", "kafka-broker-id", "--verify", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ==================== Kafka UI（开发工具，可选）====================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - log-platform
    profiles:
      - dev

  # ==================== Flink 流处理（可选）====================
  flink:
    image: flink:1.18.1-scala_2.12-java11
    container_name: flink
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink
        state.backend: rocksdb
        state.checkpoints.dir: file:///checkpoints
        state.savepoints.dir: file:///savepoints
        parallelism.default: 2
        taskmanager.numberOfTaskSlots: 4
        kafka.bootstrap.servers: kafka:29092
        state.backend.rocksdb.checkpoint.transfer.thread.num: 4
        state.backend.rocksdb.writebuffer.size: 128mb
        state.backend.rocksdb.compaction.level.max-size-level-base: 320mb
    volumes:
      - flink_checkpoints:/checkpoints
      - flink_savepoints:/savepoints
      - ./flink-jobs:/opt/flink/jobs
    networks:
      - log-platform
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
    profiles:
      - flink

  flink-worker:
    image: flink:1.18.1-scala_2.12-java11
    container_name: flink-worker
    depends_on:
      - flink
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink
        state.backend: rocksdb
        state.checkpoints.dir: file:///checkpoints
        parallelism.default: 2
        taskmanager.numberOfTaskSlots: 4
        kafka.bootstrap.servers: kafka:29092
        state.backend.rocksdb.checkpoint.transfer.thread.num: 4
        state.backend.rocksdb.writebuffer.size: 128mb
    volumes:
      - flink_checkpoints:/checkpoints
      - flink_savepoints:/savepoints
      - ./flink-jobs:/opt/flink/jobs
    networks:
      - log-platform
    profiles:
      - flink

networks:
  log-platform:
    driver: bridge

volumes:
  timescale_data:
  kafka_data:
  redis_data:
  flink_checkpoints:
  flink_savepoints:
