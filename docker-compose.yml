version: '3.8'

services:
  # ==================== 数据库 ====================
  db:
    image: postgres:16-alpine
    container_name: usop-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-usop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-usop_password}
      POSTGRES_DB: ${DB_NAME:-usop_security}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 初始化脚本（首次启动时执行）
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-usop} -d ${DB_NAME:-usop_security}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - usop-network

  # ==================== Redis 缓存 ====================
  redis:
    image: redis:7-alpine
    container_name: usop-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - usop-network

  # ==================== 后端服务 ====================
  backend:
    build:
      context: ./server-python
      dockerfile: Dockerfile
    container_name: usop-backend
    restart: always
    environment:
      # 数据库配置
      DATABASE_URL: postgresql://${DB_USER:-usop}:${DB_PASSWORD:-usop_password}@db:5432/${DB_NAME:-usop_security}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-usop}
      DB_PASSWORD: ${DB_PASSWORD:-usop_password}
      DB_NAME: ${DB_NAME:-usop_security}
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      # Flask 配置
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-usop-secret-key-production-change-in-prod}
      JWT_SECRET: ${JWT_SECRET:-usop-jwt-secret-production-change-in-prod}
      # 日志级别
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${BACKEND_PORT:-5001}:5001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # volumes:
    # 挂载代码目录用于开发（生产环境可注释）
    #  - ./server-python:/app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - usop-network

  # ==================== 前端服务 ====================
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: usop-frontend
    restart: always
    environment:
      # API 地址（生产环境使用 Nginx 环境变量）
      API_BASE_URL: http://backend:5001/api
      # Nginx 配置
      NGINX_WORKER_PROCESSES: auto
      NGINX_WORKER_CONNECTIONS: 1024
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    depends_on:
      - backend
    volumes:
      # 挂载 SSL 证书目录（可选）
      - ./web/ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - usop-network

  # ==================== 定时任务服务（可选）====================
  # scheduler:
  #   build:
  #     context: ./server-python
  #     dockerfile: Dockerfile.scheduler
  #   container_name: usop-scheduler
  #   restart: always
  #   environment:
  #     DATABASE_URL: postgresql://${DB_USER:-usop}:${DB_PASSWORD:-usop_password}@db:5432/${DB_NAME:-usop_security}
  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379
  #     REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - usop-network

# ==================== 网络 ====================
networks:
  usop-network:
    driver: bridge

# ==================== 存储卷 ====================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
