networks:
  log-platform:
    driver: bridge
services:
  flink-jobmanager:
    command: jobmanager
    container_name: flink-jobmanager
    # ⚠️ 不要再加 FLINK_PROPERTIES：flink 镜像 entrypoint 会把它追加进挂载的
    # flink-conf.yaml（bind-mount 共享文件），每次重启都追加一批重复配置；
    # 所有配置已统一写进 flink-conf/flink-conf.yaml
    healthcheck:
      interval: 30s
      retries: 5
      test:
      - CMD-SHELL
      - curl -f http://localhost:8081/overview || exit 1
      timeout: 10s
    image: flink:1.18.1-scala_2.12-java11
    networks:
    - log-platform
    ports:
    - 8081:8081
    volumes:
    - ./flink-jobs:/opt/flink/jobs
    - ./data/flink:/opt/flink/checkpoints
    - ./flink-conf/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml
    # 连接器 jar（Kafka / JDBC / PostgreSQL）：Flink 发行版自带 lib 里没有，
    # 必须逐个挂进 /opt/flink/lib（挂目录会遮蔽内置 jar，只能挂文件）
    - ./flink-jars/flink-connector-kafka-3.2.0-1.18.jar:/opt/flink/lib/flink-connector-kafka-3.2.0-1.18.jar
    - ./flink-jars/kafka-clients-3.4.0.jar:/opt/flink/lib/kafka-clients-3.4.0.jar
    - ./flink-jars/flink-connector-jdbc-3.2.0-1.18.jar:/opt/flink/lib/flink-connector-jdbc-3.2.0-1.18.jar
    - ./flink-jars/postgresql-42.6.0.jar:/opt/flink/lib/postgresql-42.6.0.jar
  flink-taskmanager:
    command: taskmanager
    depends_on:
    - flink-jobmanager
    # 单机部署只跑 1 个关联分析作业（parallelism 1），4 slots 富余；
    # 需要扩容时改回 replicas: 2 并调大 flink-conf.yaml 的 process.size
    deploy:
      replicas: 1
    image: flink:1.18.1-scala_2.12-java11
    networks:
    - log-platform
    volumes:
    - ./flink-jobs:/opt/flink/jobs
    - ./data/flink:/opt/flink/checkpoints
    - ./flink-conf/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml
    - ./flink-jars/flink-connector-kafka-3.2.0-1.18.jar:/opt/flink/lib/flink-connector-kafka-3.2.0-1.18.jar
    - ./flink-jars/kafka-clients-3.4.0.jar:/opt/flink/lib/kafka-clients-3.4.0.jar
    - ./flink-jars/flink-connector-jdbc-3.2.0-1.18.jar:/opt/flink/lib/flink-connector-jdbc-3.2.0-1.18.jar
    - ./flink-jars/postgresql-42.6.0.jar:/opt/flink/lib/postgresql-42.6.0.jar
  # SQL Gateway：后端通过它把「关联分析」Flint SQL 提交到会话集群。
  # ⚠️ 会话关闭会连带取消其中提交的作业，因此 idle-timeout 设为很长（见 -D 参数）。
  flink-sql-gateway:
    image: flink:1.18.1-scala_2.12-java11
    container_name: flink-sql-gateway
    depends_on:
    - flink-jobmanager
    networks:
    - log-platform
    ports:
    - 8083:8083
    command: >
      bash -c "/opt/flink/bin/sql-gateway.sh start-foreground
      -D sql-gateway.endpoint.rest.address=0.0.0.0
      -D sql-gateway.endpoint.rest.port=8083
      -D sql-gateway.session.idle-timeout=365d
      -D sql-gateway.session.max-num=200
      -D rest.address=flink-jobmanager
      -D rest.port=8081"
    volumes:
    - ./flink-jobs:/opt/flink/jobs
    - ./flink-conf/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml
    - ./flink-jars/flink-connector-kafka-3.2.0-1.18.jar:/opt/flink/lib/flink-connector-kafka-3.2.0-1.18.jar
    - ./flink-jars/kafka-clients-3.4.0.jar:/opt/flink/lib/kafka-clients-3.4.0.jar
    - ./flink-jars/flink-connector-jdbc-3.2.0-1.18.jar:/opt/flink/lib/flink-connector-jdbc-3.2.0-1.18.jar
    - ./flink-jars/postgresql-42.6.0.jar:/opt/flink/lib/postgresql-42.6.0.jar
  kafka:
    container_name: kafka
    environment:
      CLUSTER_ID: TUMghNssTfuY70MTwaCWkQ
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_NODE_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      interval: 30s
      retries: 5
      test:
      - CMD
      - kafka-broker-api-versions
      - --bootstrap-server
      - localhost:9092
      timeout: 10s
    image: confluentinc/cp-kafka:7.5.0
    networks:
    - log-platform
    ports:
    - 9092:9092
    - 29092:29092
    volumes:
    - ./data/kafka:/var/lib/kafka/data
  postgres:
    container_name: usop_postgres
    environment:
      POSTGRES_DB: usop_security
      POSTGRES_PASSWORD: usop_password
      POSTGRES_USER: usop
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD-SHELL
      - pg_isready -U usop -d usop_security
      timeout: 5s
    image: postgres:16-alpine
    networks:
    - log-platform
    ports:
    - 5432:5432
    restart: unless-stopped
    volumes:
    - ./data/postgres:/var/lib/postgresql/data
  redis:
    command: redis-server --appendonly yes
    container_name: redis
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - redis-cli
      - ping
      timeout: 5s
    image: redis:7-alpine
    networks:
    - log-platform
    ports:
    - 6379:6379
    volumes:
    - ./data/redis:/data
  elasticsearch:
    container_name: elasticsearch
    image: elasticsearch:8.11.0
    environment:
    - discovery.type=single-node
    - xpack.security.enabled=false
    - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
    - 9200:9200
    networks:
    - log-platform
    volumes:
    - ./data/elasticsearch:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:9200/_cluster/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
  usop:
    build:
      context: .
      dockerfile: Dockerfile.all
    container_name: usop_all
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
    - SKIP_BIGDATA_CHECK=1
    - DATABASE_URL=postgresql://usop:usop_password@postgres:5432/usop_security
    - USE_HERMES_PROXY=true
    - HERMES_BASE_URL=http://hermes-agent:8080
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    - FLINK_REST_API=http://flink-jobmanager:8081
    - FLINK_JOBMANAGER_URL=http://flink-jobmanager:8081
    - FLINK_SQL_GATEWAY_URL=http://flink-sql-gateway:8083
    - FLINK_JOBS_DIR=/app/flink-jobs
    - ES_HOSTS=http://elasticsearch:9200
    - ES_INDEX_PREFIX=usop-alerts
    networks:
    - log-platform
    ports:
    - 3266:3266
    - 5001:5001
    restart: unless-stopped
    volumes:
    - ./server-python/app:/app/app
    - ./web/src:/app/web/src
    # 关联分析作业生成的 Flink SQL 落盘到宿主机，便于审计与手工重放
    - ./flink-jobs:/app/flink-jobs
